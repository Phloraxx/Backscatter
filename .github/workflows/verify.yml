name: Verify Backscatter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Test fixed SAR signal filters without Earthdata credentials
        run: python -m unittest discover -s tests -v
      - name: Validate bundled study assets and original logo
        run: python scripts/check_web_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build public website
        working-directory: web
        run: npm run build
      - name: Validate public study source assets
        run: |
          test -s web/dist/backscatter-demo.pdf
          test -s web/dist/research.html
          test -s web/dist/data/pixels.bin
          test -s web/dist/data/assam/pixels.bin
          test -s web/dist/research/arnab-metrics.json
